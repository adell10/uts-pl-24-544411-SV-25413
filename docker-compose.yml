# Jalankan seluruh sistem:  docker compose up -d --build
# Kredensial dibaca dari file .env (TIDAK di-commit). Contohnya ada di .env.example.

# Pengaturan log Docker yang dipakai semua service:
# tiap container maksimal 3 file x 10 MB, file lama diputar (rotate) otomatis.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql          # named volume → data tidak hilang saat container dibuat ulang
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *default-logging

  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-cafehopper-backend:local}
    restart: unless-stopped
    environment:
      APP_NAME: "Cafe Hopper"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: http://localhost:8080
      LOG_CHANNEL: stdout               # log Laravel → stdout container (dibaca docker compose logs)
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: db                       # nama service, bukan IP
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      SEED_ON_START: ${SEED_ON_START:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /health memeriksa basis data + cache; curl -f gagal kalau balasan 503
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/health"]
      interval: 10s                     # cek tiap 10 detik
      timeout: 5s                       # 1 cek dianggap gagal kalau > 5 detik
      retries: 3                        # 3x gagal berturut-turut → unhealthy
      start_period: 40s                 # beri waktu migrate + seed saat container baru nyala
    logging: *default-logging
    ports:
      - "8000:8000"                     # opsional: untuk tes langsung pakai Postman

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    image: ${FRONTEND_IMAGE:-cafehopper-frontend:local}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging
    ports:
      - "8080:80"                       # buka http://localhost:8080 di browser

volumes:
  db_data: