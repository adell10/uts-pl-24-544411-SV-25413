name: CI/CD Cafe Hopper

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  # ---------- Job 1: test backend ----------
  backend-test:
    name: Backend - php artisan test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan .env untuk test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan feature test (SQLite in-memory)
        run: php artisan test

  # ---------- Job 2: build frontend ----------
  frontend-build:
    name: Frontend - npm ci & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_URL: /api