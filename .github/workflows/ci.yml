name: CI/CD Cafe Hopper

on:
  push:
    branches: [main, dev, 'feature/**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  # ---------- Job 1: test backend ----------
  backend-test:
    name: Backend - php artisan test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan .env untuk test
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan feature test (SQLite in-memory)
        run: php artisan test

  # ---------- Job 2: build frontend ----------
  frontend-build:
    name: Frontend - npm ci & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_URL: /api

  # ---------- Job 3: deploy (HANYA push ke main) ----------
  deploy:
    name: Deploy - build & push image ke ghcr.io
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nama image (huruf kecil) + tag = SHA commit
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND_IMAGE=ghcr.io/${OWNER}/cafehopper-backend:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${OWNER}/cafehopper-frontend:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login ke GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}

      - name: Build & push image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: VITE_API_URL=/api
          tags: ${{ env.FRONTEND_IMAGE }}

      # Rahasia hanya diambil dari GitHub Secrets, ditulis ke .env sementara di runner (tidak di-commit)
      - name: Siapkan .env produksi dari GitHub Secrets
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
        run: |
          {
            echo "APP_KEY=${APP_KEY}"
            echo "DB_DATABASE=cafehopper"
            echo "DB_USERNAME=cafehopper"
            echo "DB_PASSWORD=${DB_PASSWORD}"
            echo "DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}"
            echo "SEED_ON_START=true"
          } > .env

      - name: Jalankan image yang baru di-push (smoke test)
        run: |
          docker compose pull backend frontend
          docker compose up -d --no-build
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/login \
              -H 'Accept: application/json' -H 'Content-Type: application/json' \
              -d '{"email":"hailo@cafehopper.test","password":"password123"}' || true)
            echo "Percobaan $i: HTTP $code"
            [ "$code" = "200" ] && break
            sleep 5
          done
          [ "$code" = "200" ]

      - name: Bukti container berjalan
        if: always()
        run: |
          docker compose ps
          docker compose logs backend --tail=40

      - name: Bersihkan
        if: always()
        run: |
          docker compose down -v
          rm -f .env