server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Permintaan API diteruskan ke container Laravel lewat NAMA SERVICE "backend"
    # (bukan IP laptop). Browser cukup memanggil /api/... di alamat yang sama.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File statis hasil build boleh di-cache lama
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Vue Router (mode history): halaman tidak 404 saat di-refresh
    location / {
        try_files $uri $uri/ /index.html;
    }
}