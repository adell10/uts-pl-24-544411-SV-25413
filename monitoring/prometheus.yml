# Prometheus menarik (scrape) angka dari tiap sumber setiap 15 detik.
# Nama host = nama service di docker-compose.yml, bukan IP / localhost.
global:
  scrape_interval: 15s       # seberapa sering angka ditarik
  evaluation_interval: 15s   # seberapa sering aturan alarm dicek

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus      # Prometheus memantau dirinya sendiri
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: container       # CPU & memori tiap container (cAdvisor)
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: server          # CPU, RAM, disk mesin (node-exporter)
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: aplikasi        # backend Laravel Cafe Hopper
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
